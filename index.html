<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador de Pelotas</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 40px; }
        #image-preview { max-width: 300px; max-height: 300px; margin-top: 15px; border-radius: 8px; }
        #label-container { margin-top: 20px; font-weight: bold; font-size: 1.1em; }
    </style>
</head>
<body>
    <h2>Clasificador de Pelotas (Por Imagen)</h2>
    
    <input type="file" id="image-upload" accept="image/*" onchange="predictImage(event)" />
    <br>
    <img id="image-preview" src="" alt="Previsualización de la imagen" style="display: none;" />
    
    <div id="label-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script type="text/javascript">
        const URL = "./";
        let model, labelContainer, maxPredictions;

        async function initModel() {
            if (!model) {
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();
                
                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "";
                for (let i = 0; i < maxPredictions; i++) {
                    labelContainer.appendChild(document.createElement("div"));
                }
            }
        }

        async function predictImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Mostrar la imagen seleccionada
            const imgElement = document.getElementById("image-preview");
            imgElement.src = window.URL.createObjectURL(file);
            imgElement.style.display = "inline-block";

            // Asegurar que el modelo esté cargado
            await initModel();

            // Esperar a que la imagen cargue en el DOM para predecir
            imgElement.onload = async () => {
                const prediction = await model.predict(imgElement);
                for (let i = 0; i < maxPredictions; i++) {
                    const classPrediction =
                        prediction[i].className + ": " + (prediction[i].probability * 100).toFixed(1) + "%";
                    labelContainer.childNodes[i].innerHTML = classPrediction;
                }
            };
        }
    </script>
</body>
</html>
